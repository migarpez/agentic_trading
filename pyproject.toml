[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "agentic-trading"
version = "0.1.0"
description = "Modelo de ML sobre OHLCV diario y agentes de trading autónomos"
readme = "README.md"
requires-python = ">=3.10,<3.13"
dependencies = [
    "torch==2.14.1",
    "numpy==2.2.6",
    "pandas==2.3.3",
    "pyarrow==25.0.1",
    "yfinance==1.8.0",
    "requests==2.34.2",
    "lxml==6.1.3",
    "scikit-learn==1.7.2",
    "scipy==1.15.3",
    "matplotlib==3.10.9",
    "seaborn==0.13.2",
]

[project.optional-dependencies]
dev = [
    "jupyterlab==4.6.5",
    "ipykernel==7.3.0",
    "pytest==9.2.0",
    "ruff==0.17.4",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.pytest.ini_options]
testpaths = ["tests"]
